name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Check build output
        run: node scripts/check.mjs

      - name: Pack zip
        run: npm run pack

      - name: Verify zip contents
        run: |
          python3 - <<'PYEOF'
          import glob, zipfile
          zips = glob.glob('dist/*.zip')
          assert len(zips) == 1, zips
          names = zipfile.ZipFile(zips[0]).namelist()
          for need in ('manifest.json', 'popup.html', 'rules/ua.json'):
              assert need in names, f'missing: {need}'
          assert any(n.endswith('bridge.iife.js') for n in names), f'content script missing in {names}'
          print('zip OK:', zips[0], names)
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: egov-bridge-package
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes
