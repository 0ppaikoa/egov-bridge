<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e-Gov 電子申請ブリッジ</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 12px 14px 10px;
      background: #ffffff;
      color: #1f1f1f;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 700;
    }
    .sub {
      margin: 0 0 10px;
      font-size: 11px;
      color: #666;
    }
    nav { border-top: 1px solid #e2e2e2; }
    a.item {
      display: block;
      padding: 9px 2px;
      border-bottom: 1px solid #e2e2e2;
      text-decoration: none;
      color: #0b57d0;
    }
    a.item:hover { background: #f5f5f5; }
    a.item:focus-visible {
      outline: 2px solid #0b57d0;
      outline-offset: 1px;
      background: #f5f5f5;
    }
    .label { display: block; font-size: 13px; font-weight: 600; }
    .desc { display: block; margin-top: 1px; font-size: 11px; color: #666; }
    footer {
      margin-top: 10px;
      font-size: 10px;
      color: #777;
    }
    footer .ver { font-family: Consolas, Menlo, monospace; }
  </style>
</head>
<body>
  <h1>e-Gov 電子申請ブリッジ</h1>
  <p class="sub">e-Gov電子申請の入り口を開きます。</p>

  <nav aria-label="申請画面への入口">
    <a class="item" href="https://shinsei.e-gov.go.jp/recept/startup/" target="_blank" rel="noopener noreferrer">
      <span class="label">申請画面を開く</span>
      <span class="desc">ログイン後、公式アプリと同じ手順の申請画面へ進みます</span>
    </a>
    <a class="item" href="https://shinsei.e-gov.go.jp/recept/procedure-search/" target="_blank" rel="noopener noreferrer">
      <span class="label">手続を検索する</span>
      <span class="desc">手続名称・手続IDから申請したい手続を探します</span>
    </a>
    <a class="item" href="https://shinsei.e-gov.go.jp/recept/" target="_blank" rel="noopener noreferrer">
      <span class="label">電子申請トップ</span>
      <span class="desc">e-Gov電子申請のサービス入口ページ</span>
    </a>
  </nav>

  <footer>
    デジタル庁とは無関係の非公式ツールです。<br />
    <span class="ver">v0.2.2</span>
  </footer>
</body>
</html>
