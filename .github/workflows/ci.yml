name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check
        run: node scripts/check.mjs

      - name: Build extension package
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Verify zip contents
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          zips = glob.glob('dist/*.zip')
          assert len(zips) == 1, zips
          names = zipfile.ZipFile(zips[0]).namelist()
          for need in ('manifest.json', 'src/shim.js', 'src/bridge.js', 'src/background.js', 'README.md', 'LICENSE'):
              assert need in names, f'missing: {need}'
          print('zip OK:', zips[0], names)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: egov-bridge-package
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes
