<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e-Gov 電子申請</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 300px;
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
      font-size: 13px;
      color: #1f1f1f;
      background: #ffffff;
    }
    header {
      padding: 10px 14px 6px;
      border-bottom: 1px solid #e3e3e3;
    }
    header .title { font-size: 13px; font-weight: 700; }
    header .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      color: #8a6d00;
      background: #fff3bf;
      vertical-align: 1px;
    }
    main { padding: 12px 14px; }
    a.action {
      display: block;
      padding: 10px 12px;
      margin: 8px 0;
      border: 1px solid #c9d6e2;
      border-radius: 6px;
      background: #f2f6fb;
      color: #0b5394;
      text-decoration: none;
      font-weight: 600;
    }
    a.action:hover { background: #e6edf7; border-color: #a9bdd4; }
    a.action small {
      display: block;
      font-weight: 400;
      color: #555;
      font-size: 11px;
      margin-top: 3px;
    }
    footer {
      padding: 8px 14px 10px;
      border-top: 1px solid #e3e3e3;
      color: #777;
      font-size: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <span class="title">e-Gov 電子申請</span><span class="badge">非公式</span>
  </header>
  <main>
    <a class="action" href="https://shinsei.e-gov.go.jp/recept/startup/" target="_blank" rel="noopener noreferrer">
      申請画面を開く
      <small>ログイン後に電子申請アプリケーションと同じ画面へ進みます</small>
    </a>
    <a class="action" href="https://shinsei.e-gov.go.jp/recept/procedure-search/" target="_blank" rel="noopener noreferrer">
      手続を検索する
      <small>手続の検索画面（電子申請できる手続の一覧）</small>
    </a>
    <a class="action" href="https://shinsei.e-gov.go.jp/recept/" target="_blank" rel="noopener noreferrer">
      電子申請トップ
      <small>e-Gov電子申請の入口ページ</small>
    </a>
  </main>
  <footer>
    デジタル庁とは無関係の非公式ツールです。<br />
    リンクはすべてブラウザの新しいタブで開きます。
  </footer>
</body>
</html>
